name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--bundles msi"
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,rpm"
          - name: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            patchelf
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # MSI bundling uses a pinned WiX 3.14 toolset that Tauri downloads without
      # retrying. Pre-fetch it with retries and cache it so a transient CDN
      # failure cannot break the release.
      - name: Cache WiX toolset
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri\WixTools314
          key: tauri-wix314-binaries-v1
      - name: Pre-fetch WiX toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          $required = @(
            'candle.exe', 'candle.exe.config', 'darice.cub', 'light.exe',
            'light.exe.config', 'wconsole.dll', 'winterop.dll', 'wix.dll',
            'WixUIExtension.dll', 'WixUtilExtension.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $tools $_)) }
          if ((Test-Path $tools) -and -not $missing) {
            Write-Host 'Using cached WiX toolset'
            exit 0
          }

          if (Test-Path $tools) {
            Remove-Item -LiteralPath $tools -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $expectedSha256 = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
            Write-Host "Downloading WiX toolset (attempt $attempt/5)"
            & curl.exe --fail --location --silent --show-error `
              --retry 4 --retry-all-errors --retry-delay 4 `
              --connect-timeout 30 --max-time 300 `
              --output $zip $url
            if ($LASTEXITCODE -eq 0) {
              break
            }
            Start-Sleep -Seconds ($attempt * 5)
          }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) {
            throw 'Failed to download the WiX toolset'
          }

          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "WiX toolset checksum mismatch: $actualSha256"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $tools -Force
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $tools $_)) }
          if ($missing) {
            throw "WiX toolset is incomplete: $($missing -join ', ')"
          }
          Write-Host 'WiX toolset is ready'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Keyport SSH ${{ github.ref_name }}"
          releaseBody: |
            Keyport SSH ${{ github.ref_name }}

            - Windows x64: MSI installer
            - Linux x64: DEB and RPM packages
            - macOS universal: DMG

            首次运行前请确认本机 OpenSSH 与平台构建依赖均可用。
            完整说明见仓库 README。提交问题请附上操作系统与复现步骤。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
